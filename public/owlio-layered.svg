<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Owlio — layered blue and gold owl mascot</title>
  <desc id="desc">Editable vector recreation of Owlio. Separate body, wings, feet, head, eyes, eyelids and beak groups. Eyelids and happy eyes are hidden by default. Left and right refer to the viewer.</desc>
